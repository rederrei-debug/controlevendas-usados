<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Controle de Vendas</title>

<style>
:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#f59e0b;
  --text:#111827;
  --border:#e5e7eb;
  --muted:#6b7280;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  padding:20px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  background:var(--primary);
  color:#fff;
}

/* NAV (2x2 no celular) */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:15px;
  max-width:900px;
  margin:auto;
}

nav button{
  flex:1 1 calc(50% - 10px);
  padding:14px;
  border-radius:22px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-weight:700;
  font-size:15px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  border:1px solid var(--border);
  margin-bottom:15px;
}

.hidden{display:none}

input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  margin-bottom:10px;
  font-size:16px;
  background:#fff;
}

textarea{resize:vertical}

button.action{
  width:100%;
  padding:12px;
  border-radius:14px;
  background:var(--primary);
  color:#fff;
  border:none;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}

button.action:disabled{
  opacity:.6;
  cursor:not-allowed;
}

button.secondary{
  background:#111827;
}
button.success{
  background:var(--success);
}
button.danger{
  background:var(--danger);
}

/* DASHBOARD */
.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  background:#f9fafb;
  padding:20px;
  border-radius:18px;
  border:1px solid var(--border);
}

.stat span{
  display:block;
  font-size:28px;
  font-weight:900;
  margin-top:8px;
}

.stat:nth-child(1) span{color:var(--warning)}
.stat:nth-child(2) span{color:var(--primary)}
.stat:nth-child(3) span{color:var(--success)}

/* CADASTRO - área da foto */
.foto-area{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:12px;
  align-items:stretch;
  margin-bottom:10px;
}

.foto-preview{
  border:1px dashed var(--border);
  border-radius:16px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  min-height:110px;
  color:var(--muted);
  text-align:center;
  padding:10px;
}

.foto-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.foto-botoes{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

/* VENDA */
.venda-top{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}

.venda-top input{
  margin-bottom:0;
}

.produto{
  position:relative;
  display:grid;
  grid-template-columns:90px 1fr;
  gap:15px;
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin-bottom:15px;
  background:#fff;
}

.produto img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:14px;
  background:#e5e7eb;
}

.trash-btn{
  position:absolute;
  top:10px;
  right:10px;
  border:none;
  background:#fff;
  border:1px solid var(--border);
  width:38px;
  height:38px;
  border-radius:12px;
  cursor:pointer;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.trash-btn:active{transform:scale(.98)}

/* HISTÓRICO */
.historico-item{
  border:1px solid var(--border);
  border-radius:18px;
  padding:12px;
  margin-bottom:12px;
  background:#fff;
}

.historico-header{
  display:grid;
  grid-template-columns:70px 1fr 90px 24px;
  align-items:center;
  gap:6px;
}

.historico-header img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:14px;
}

.seta{
  font-size:18px;
  text-align:center;
  cursor:pointer;
}

.historico-detalhes{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--border);
  display:none;
}

/* MOBILE */
@media (max-width: 520px){
  header{padding:16px;font-size:20px}
  .container{padding:12px}
  .card{padding:16px}
  .dashboard{grid-template-columns:1fr}
  .stat span{font-size:34px}
  .historico-header{grid-template-columns:64px 1fr 78px 24px}
  .historico-header img{width:64px;height:64px}
  .foto-area{grid-template-columns:110px 1fr}
}
</style>
</head>

<body>
<header>💰 Controle de Vendas</header>

<nav>
  <button onclick="mostrar('dashboard')">Dashboard</button>
  <button onclick="mostrar('cadastro')">Cadastrar</button>
  <button onclick="mostrar('venda')">Vender</button>
  <button onclick="mostrar('historico')">Histórico</button>
</nav>

<div class="container">

  <!-- DASHBOARD -->
  <div id="dashboard" class="card">
    <div class="dashboard">
      <div class="stat">Produtos em estoque<span id="qtd">0</span></div>
      <div class="stat">Valor em estoque<span>R$ <span id="valorEstoque">0.00</span></span></div>
      <div class="stat">Lucro total<span>R$ <span id="lucro">0.00</span></span></div>
    </div>
  </div>

  <!-- CADASTRO -->
  <div id="cadastro" class="card hidden">
    <input id="nomeProduto" placeholder="Nome do produto">
    <input id="valorCompra" type="number" inputmode="decimal" placeholder="Valor de compra">

    <!-- input real (escondido) -->
    <input id="imgInput" type="file" accept="image/*" style="display:none" onchange="carregarImagemDoInput(event)">

    <div class="foto-area">
      <div class="foto-preview" id="fotoPreview">
        <span>Sem foto<br>(opcional)</span>
      </div>

      <div class="foto-botoes">
        <button class="action secondary" type="button" onclick="pedirCamera()">📸 Tirar foto</button>
        <button class="action secondary" type="button" onclick="pedirGaleria()">🖼️ Galeria</button>
        <button class="action danger" type="button" onclick="removerImagem()">🧽 Remover foto</button>
      </div>
    </div>

    <button class="action" id="btnCadastrar" onclick="cadastrar()">Cadastrar Produto</button>
  </div>

  <!-- VENDA -->
  <div id="venda" class="card hidden">
    <div class="venda-top">
      <input id="buscaVenda" placeholder="Pesquisar na venda..." autocomplete="off" inputmode="search">
    </div>
    <div id="vendaLista"></div>
  </div>

  <!-- HISTÓRICO -->
  <div id="historico" class="card hidden">
    <select id="filtroMes" onchange="atualizarHistorico()">
      <option value="">Todos os meses</option>
      <option value="0">Janeiro</option><option value="1">Fevereiro</option><option value="2">Março</option>
      <option value="3">Abril</option><option value="4">Maio</option><option value="5">Junho</option>
      <option value="6">Julho</option><option value="7">Agosto</option><option value="8">Setembro</option>
      <option value="9">Outubro</option><option value="10">Novembro</option><option value="11">Dezembro</option>
    </select>
    <div id="historicoLista"></div>
  </div>

</div>

<script>
let estoque = [];
let historico = [];
let lucroTotal = 0;

let imagemTemp = null;          // pode ser dataURL OU file/content URI
let imagemCarregando = false;

let saveTimer = null;
let lastSnapshotB64 = null;

let viewAtual = "dashboard";

/* ========= helpers base64 (unicode safe) ========= */
function toB64Unicode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function fromB64Unicode(b64){
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

/* ========= Kodular bridge ========= */
function isKodular(){
  return !!(window.AppInventor && typeof window.AppInventor.setWebViewString === "function");
}
function kodularSet(value){
  try{
    if(!isKodular()) return false;
    window.AppInventor.setWebViewString(String(value));
    return true;
  }catch(e){
    console.log("Kodular setWebViewString falhou:", e);
    return false;
  }
}

/* snapshot */
function snapshotObj(updatedAt){
  return {
    v: 1,
    updatedAt: updatedAt || Date.now(),
    estoque,
    historico,
    lucroTotal
  };
}
function exportSnapshotB64(updatedAt){
  return toB64Unicode(JSON.stringify(snapshotObj(updatedAt)));
}

function enviarParaKodularDebounced(updatedAt){
  if(!isKodular()) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      const b64 = exportSnapshotB64(updatedAt);
      lastSnapshotB64 = b64;
      kodularSet(b64);
    }catch(e){
      console.log("Falha ao enviar para Kodular:", e);
    }
  }, 500); // essencial para “cadastro rápido”
}

/* Função chamada pelo Kodular via EvaluateJS (PageLoaded) */
window.loadFromKodularB64 = function(b64){
  try{
    if(!b64) return;

    const json = fromB64Unicode(b64);
    const data = JSON.parse(json);

    if(!data || typeof data !== "object") return;

    const remoteUpdated = Number(data.updatedAt || 0);
    const localUpdated  = Number(localStorage.getItem("updatedAt") || 0);

    // aplica apenas se vier mais novo do TinyDB
    if(localUpdated && remoteUpdated && remoteUpdated <= localUpdated){
      return;
    }

    estoque = Array.isArray(data.estoque) ? data.estoque : [];
    historico = Array.isArray(data.historico) ? data.historico : [];
    lucroTotal = Number(data.lucroTotal || 0);

    try{
      localStorage.setItem("estoque", JSON.stringify(estoque));
      localStorage.setItem("historico", JSON.stringify(historico));
      localStorage.setItem("lucroTotal", String(lucroTotal));
      localStorage.setItem("updatedAt", String(remoteUpdated || Date.now()));
    }catch(e){}

    atualizarDashboard();
    atualizarHistorico();

    // se estiver na tela venda, atualiza
    if(viewAtual === "venda") renderVenda();
  }catch(e){
    console.log("loadFromKodularB64 erro:", e);
  }
};

/* ========= STORAGE ========= */
function salvarDados(){
  const updatedAt = Date.now();

  try{
    localStorage.setItem("estoque", JSON.stringify(estoque));
    localStorage.setItem("historico", JSON.stringify(historico));
    localStorage.setItem("lucroTotal", String(lucroTotal));
    localStorage.setItem("updatedAt", String(updatedAt));
  }catch(e){
    console.log("localStorage cheio/erro:", e);
  }

  enviarParaKodularDebounced(updatedAt);
}

function carregarDados(){
  try{
    estoque = JSON.parse(localStorage.getItem("estoque")) || [];
    historico = JSON.parse(localStorage.getItem("historico")) || [];
    lucroTotal = parseFloat(localStorage.getItem("lucroTotal")) || 0;
  }catch(e){
    estoque = [];
    historico = [];
    lucroTotal = 0;
  }
  atualizarDashboard();
  atualizarHistorico();
}

/* ========= NAV ========= */
function mostrar(id){
  // se sair da venda, zera busca (pedido seu)
  if(viewAtual === "venda" && id !== "venda"){
    const b = document.getElementById("buscaVenda");
    if(b) b.value = "";
  }

  document.querySelectorAll('.card').forEach(e => e.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');

  viewAtual = id;

  if(id === "venda") renderVenda();
  if(id === "historico") atualizarHistorico();

  // conforto no mobile
  try{ window.scrollTo({top:0,behavior:"instant"}); }catch(e){}
}

/* ========= IMAGEM ========= */
function normalizeMediaUri(p){
  if(!p) return "";
  p = String(p).trim();
  if(/^(data:|file:|content:|https?:)/i.test(p)) return p;
  if(p.startsWith("/")) return "file://" + p; // vira file:///...
  return p;
}

function setImagemTemp(src){
  imagemTemp = src ? normalizeMediaUri(src) : null;
  atualizarPreviewImagem();
}

function atualizarPreviewImagem(){
  const box = document.getElementById("fotoPreview");
  if(!box) return;

  if(!imagemTemp){
    box.innerHTML = "<span>Sem foto<br>(opcional)</span>";
    return;
  }

  box.innerHTML = "";
  const img = document.createElement("img");
  img.src = imagemTemp;
  img.alt = "Foto do produto";
  box.appendChild(img);
}

function removerImagem(){
  setImagemTemp(null);
  const inp = document.getElementById("imgInput");
  if(inp) inp.value = "";
}

/* ========= comandos câmera/galeria ========= */
function enviarComandoKodular(cmd){
  // IMPORTANTÍSSIMO: timestamp para sempre disparar WebViewStringChange
  const token = Date.now();
  kodularSet(cmd + "|" + token);
}

// Chamado pelo botão "Tirar foto"
function pedirCamera(){
  if(isKodular()){
    enviarComandoKodular("CMD:CAMERA");
    return;
  }
  // fallback web: tenta abrir camera
  const inp = document.getElementById("imgInput");
  if(inp){
    inp.setAttribute("capture","environment");
    inp.click();
  }
}

// Chamado pelo botão "Galeria"
function pedirGaleria(){
  if(isKodular()){
    enviarComandoKodular("CMD:GALERIA");
    return;
  }
  // fallback web: abre galeria
  const inp = document.getElementById("imgInput");
  if(inp){
    inp.removeAttribute("capture");
    inp.click();
  }
}

/* ========= callbacks do Kodular (EvaluateJS) ========= */
// NO KODULAR, você vai chamar isso assim:
// Camera1.AfterPicture  -> WebViewer1.EvaluateJS:  window.onKodularCamera(" + get image + ");
// ImagePicker.AfterPicking -> WebViewer1.EvaluateJS: window.onKodularGallery(" + get selection + ");
window.onKodularCamera = function(pathOrUri){
  setImagemTemp(pathOrUri);
};
window.onKodularGallery = function(pathOrUri){
  setImagemTemp(pathOrUri);
};

/* ========= carregar imagem do input (WEB) com compressão ========= */
function carregarImagemDoInput(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;

  imagemCarregando = true;
  document.getElementById("btnCadastrar").disabled = true;

  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 700;
      let w = img.width, h = img.height;
      const scale = Math.min(1, max / Math.max(w, h));
      const cw = Math.round(w * scale);
      const ch = Math.round(h * scale);

      const canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, cw, ch);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
      setImagemTemp(dataUrl);

      imagemCarregando = false;
      document.getElementById("btnCadastrar").disabled = false;
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ========= CADASTRO ========= */
function cadastrar(){
  if(imagemCarregando) return alert("Aguarde a imagem carregar.");
  if(!nomeProduto.value || !valorCompra.value) return alert("Preencha tudo");

  estoque.push({
    nome: nomeProduto.value,
    compra: +valorCompra.value,
    imagem: imagemTemp
  });

  nomeProduto.value = "";
  valorCompra.value = "";
  removerImagem();

  salvarDados();
  atualizarDashboard();
  if(viewAtual === "venda") renderVenda();
}

/* ========= VENDA ========= */
document.getElementById("buscaVenda").addEventListener("input", () => {
  // NÃO recria o input (evita sumir teclado). Só atualiza lista.
  renderVendaLista();
});

function renderVenda(){
  renderVendaLista();
}

function renderVendaLista(){
  const lista = document.getElementById("vendaLista");
  if(!lista) return;

  const termo = (document.getElementById("buscaVenda").value || "").trim().toLowerCase();

  lista.innerHTML = "";

  const itens = estoque
    .map((p, i) => ({p,i}))
    .filter(({p}) => !termo || (p.nome || "").toLowerCase().includes(termo));

  if(itens.length === 0){
    lista.innerHTML = `<div style="color:var(--muted);padding:10px 4px;">Nenhum item encontrado.</div>`;
    return;
  }

  itens.forEach(({p,i}) => {
    const div = document.createElement("div");
    div.className = "produto";
    div.innerHTML = `
      <button class="trash-btn" type="button" title="Excluir item" onclick="excluirProduto(${i})">🗑️</button>
      <img src="${p.imagem || ''}" onerror="this.style.visibility='hidden'">
      <div>
        <strong>${escapeHtml(p.nome || "")}</strong><br>
        <small>Custo: R$ ${Number(p.compra || 0).toFixed(2)}</small>
        <input type="date" id="data-${i}">
        <input type="number" inputmode="decimal" placeholder="Valor de venda" id="venda-${i}">
        <textarea placeholder="Nota / Detalhes" id="nota-${i}"></textarea>
        <button class="action success" type="button" onclick="vender(${i})">Vender</button>
      </div>
    `;
    lista.appendChild(div);
  });
}

function excluirProduto(i){
  const p = estoque[i];
  if(!p) return;
  if(!confirm(`Excluir "${p.nome}" do estoque?`)) return;

  estoque.splice(i,1);
  salvarDados();
  atualizarDashboard();
  renderVendaLista();
}

function vender(i){
  const vEl = document.getElementById(`venda-${i}`);
  if(!vEl) return;

  const v = parseFloat(vEl.value);
  if(!v) return alert("Informe o valor");

  const p = estoque[i];
  if(!p) return alert("Item não encontrado. Atualize a tela.");

  const nota = (document.getElementById(`nota-${i}`)?.value) || "";
  const dataInput = (document.getElementById(`data-${i}`)?.value) || "";
  const dataVenda = dataInput ? new Date(dataInput + "T12:00") : new Date();

  lucroTotal += v - Number(p.compra || 0);

  historico.push({
    ...p,
    venda: v,
    nota,
    data: dataVenda.toLocaleDateString("pt-BR"),
    mes: dataVenda.getMonth(),
    ts: dataVenda.getTime()
  });

  estoque.splice(i,1);

  salvarDados();
  atualizarDashboard();
  atualizarHistorico();
  renderVendaLista();
}

/* ========= DASHBOARD ========= */
function atualizarDashboard(){
  qtd.textContent = estoque.length;
  valorEstoque.textContent = estoque.reduce((s,p)=>s+Number(p.compra||0),0).toFixed(2);
  lucro.textContent = Number(lucroTotal||0).toFixed(2);
}

/* ========= HISTÓRICO ========= */
function atualizarHistorico(){
  const mes = filtroMes.value;
  historicoLista.innerHTML = "";

  historico
    .slice()
    .sort((a,b)=>b.ts-a.ts)
    .filter(h=>mes==="" || h.mes==mes)
    .forEach((h,i)=>{
      historicoLista.innerHTML += `
        <div class="historico-item">
          <div class="historico-header">
            <img src="${h.imagem || ''}" onerror="this.style.visibility='hidden'">
            <strong onclick="toggleDetalhes(${i})">${escapeHtml(h.nome || "")}</strong>
            <div onclick="toggleDetalhes(${i})">${h.data || ""}</div>
            <div class="seta" id="seta-${i}" onclick="toggleDetalhes(${i})">▶</div>
          </div>
          <div class="historico-detalhes" id="detalhes-${i}">
            <p>Compra: R$ ${Number(h.compra||0).toFixed(2)}</p>
            <p>Venda: R$ ${Number(h.venda||0).toFixed(2)}</p>
            <p>Lucro: R$ ${(Number(h.venda||0)-Number(h.compra||0)).toFixed(2)}</p>
            <p>Nota: ${escapeHtml(h.nota || "-")}</p>
            <button class="action danger" type="button" onclick="excluirVenda(${i})">Excluir</button>
          </div>
        </div>`;
    });
}

function toggleDetalhes(i){
  const d = document.getElementById(`detalhes-${i}`);
  const s = document.getElementById(`seta-${i}`);
  const aberto = d.style.display === "block";
  d.style.display = aberto ? "none" : "block";
  s.textContent = aberto ? "▶" : "▼";
}

function excluirVenda(i){
  if(!confirm("Excluir esta venda?")) return;
  const h = historico[i];
  lucroTotal -= (Number(h.venda||0) - Number(h.compra||0));
  historico.splice(i,1);
  salvarDados();
  atualizarDashboard();
  atualizarHistorico();
}

/* ========= util ========= */
function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* INIT */
window.addEventListener("load", () => {
  carregarDados();
  atualizarPreviewImagem();
});
</script>
</body>
</html>
