<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Controle de Vendas</title>

<style>
:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#f59e0b;
  --text:#111827;
  --border:#e5e7eb;
}

*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-text-size-adjust:100%;
}

header{
  padding:18px 16px;
  text-align:center;
  font-size:22px;
  font-weight:800;
  background:var(--primary);
  color:#fff;
}

/* NAV (2x2) */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:14px;
  max-width:900px;
  margin:auto;
}

nav button{
  flex:1 1 calc(50% - 10px);
  padding:14px 12px;
  border-radius:22px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}

.container{
  max-width:900px;
  margin:auto;
  padding:14px;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:16px;
  border:1px solid var(--border);
  margin-bottom:14px;
}

.hidden{display:none}

input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  margin-bottom:10px;
  font-size:16px;
  outline:none;
}

textarea{resize:vertical}

button.action{
  width:100%;
  padding:12px;
  border-radius:14px;
  background:var(--primary);
  color:#fff;
  border:none;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}

button.action:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* DASHBOARD */
.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr); /* desktop */
  gap:12px;
}

.stat{
  background:#f9fafb;
  padding:16px;
  border-radius:18px;
  border:1px solid var(--border);
}

.stat .label{
  font-size:14px;
  font-weight:800;
  opacity:.9;
}

.stat .value{
  display:block;
  font-size:28px;
  font-weight:900;
  margin-top:6px;
  line-height:1.1;
}

.stat .sub{
  margin-top:6px;
  font-size:13px;
  font-weight:900;
  opacity:.9;
  line-height:1.1;
}

.stat:nth-child(1) .value{color:var(--warning)}  /* qtd estoque */
.stat:nth-child(2) .value{color:var(--primary)}  /* valor estoque */
.stat:nth-child(3) .value{color:#0f766e}         /* faturamento */
.stat:nth-child(3) .sub{color:#0f766e}           /* itens vendidos */
.stat:nth-child(4) .value{color:var(--success)}  /* lucro */
.stat:nth-child(4) .sub{color:var(--success)}

/* CADASTRO imagem */
.imgRow{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
}

.previewBox{
  width:110px;
  height:110px;
  border-radius:16px;
  border:1px dashed var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f9fafb;
  overflow:hidden;
}

.previewBox img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.previewHint{
  font-size:13px;
  text-align:center;
  opacity:.65;
  padding:8px;
}

.btnRow{
  display:flex;
  gap:10px;
}

.btnSmall{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#fff;
  font-weight:800;
  cursor:pointer;
}

.btnSmall.primary{
  background:var(--primary);
  color:#fff;
  border:none;
}

.btnSmall.danger{
  background:var(--danger);
  color:#fff;
  border:none;
}

/* VENDA */
#venda{ padding:0; }

.produto{
  position:relative;
  display:grid;
  grid-template-columns:90px 1fr;
  gap:14px;
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
  background:#fff;
}

.produto img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:14px;
  background:#e5e7eb;
}

.deleteMini{
  position:absolute;
  top:10px;
  right:10px;
  width:36px;
  height:36px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.deleteMini:active{transform:scale(0.98)}

/* HISTÓRICO */
.historico-item{
  border:1px solid var(--border);
  border-radius:18px;
  padding:12px;
  margin-bottom:12px;
  background:#fff;
}

.historico-header{
  display:grid;
  grid-template-columns:70px 1fr 90px 24px;
  align-items:center;
  gap:6px;
}

.historico-header img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:14px;
  background:#e5e7eb;
}

.seta{
  font-size:18px;
  text-align:center;
  cursor:pointer;
}

.historico-detalhes{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--border);
  display:none;
}

/* MOBILE: um embaixo do outro (como antes) */
@media (max-width: 520px){
  header{padding:16px 12px;font-size:20px}
  .container{padding:12px}
  .card{padding:14px}
  .dashboard{grid-template-columns:1fr} /* <<< VOLTOU 1 por linha */
  .stat .value{font-size:34px}
  .stat .sub{font-size:14px}
  .historico-header{grid-template-columns:64px 1fr 78px 24px}
  .historico-header img{width:64px;height:64px}
}
</style>
</head>

<body>
<header>💰 Controle de Vendas</header>

<nav>
  <button onclick="mostrar('dashboard')">Dashboard</button>
  <button onclick="mostrar('cadastro')">Cadastrar</button>
  <button onclick="mostrar('venda')">Vender</button>
  <button onclick="mostrar('historico')">Histórico</button>
</nav>

<div class="container">

  <!-- DASHBOARD -->
  <div id="dashboard" class="card">
    <div class="dashboard">
      <div class="stat">
        <div class="label">Produtos em estoque</div>
        <span class="value" id="qtd">0</span>
      </div>

      <div class="stat">
        <div class="label">Valor em estoque</div>
        <span class="value">R$ <span id="valorEstoque">0.00</span></span>
      </div>

      <!-- FATURAMENTO + ITENS VENDIDOS -->
      <div class="stat">
        <div class="label">Faturamento total</div>
        <span class="value">R$ <span id="faturamento">0.00</span></span>
        <div class="sub" id="itensVendidos">Itens vendidos: 0</div>
      </div>

      <div class="stat">
        <div class="label">Lucro total</div>
        <span class="value">R$ <span id="lucro">0.00</span></span>
        <div class="sub" id="lucroPercent">Lucro do investimento: 0,0%</div>
      </div>
    </div>
  </div>

  <!-- CADASTRO -->
  <div id="cadastro" class="card hidden">
    <input id="nomeProduto" placeholder="Nome do produto" autocomplete="off" />
    <input id="valorCompra" type="number" placeholder="Valor de compra" inputmode="decimal" />

    <div class="imgRow">
      <div class="previewBox" id="previewBox">
        <div class="previewHint" id="previewHint">Sem foto<br>(opcional)</div>
      </div>

      <div>
        <!-- SOMENTE GALERIA -->
        <input id="imgInput" type="file" accept="image/*" style="display:none" />
        <div class="btnRow">
          <button class="btnSmall primary" type="button" onclick="abrirGaleria()">🖼️ Selecionar foto</button>
          <button class="btnSmall danger" type="button" onclick="removerFoto()">🧹 Remover</button>
        </div>
      </div>
    </div>

    <button class="action" id="btnCadastrar" onclick="cadastrar()">Cadastrar Produto</button>
  </div>

  <!-- VENDA -->
  <div id="venda" class="hidden"></div>

  <!-- HISTÓRICO -->
  <div id="historico" class="card hidden">
    <select id="filtroMes" onchange="atualizarHistorico()">
      <option value="">Todos os meses</option>
      <option value="0">Janeiro</option><option value="1">Fevereiro</option><option value="2">Março</option>
      <option value="3">Abril</option><option value="4">Maio</option><option value="5">Junho</option>
      <option value="6">Julho</option><option value="7">Agosto</option><option value="8">Setembro</option>
      <option value="9">Outubro</option><option value="10">Novembro</option><option value="11">Dezembro</option>
    </select>
    <div id="historicoLista"></div>
  </div>

</div>

<script>
/* ====================== ESTADO ====================== */
let estoque = [];
let historico = [];
let lucroTotal = 0;

let imagemTemp = null;
let imagemCarregando = false;

let saveTimer = null;

/* ====================== BASE64 unicode safe ====================== */
function toB64Unicode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function fromB64Unicode(b64){
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

/* ====================== KODULAR bridge ====================== */
function isKodular(){
  return !!(window.AppInventor && typeof window.AppInventor.setWebViewString === "function");
}

function snapshotObj(updatedAt){
  return {
    v: 1,
    updatedAt: updatedAt || Date.now(),
    estoque,
    historico,
    lucroTotal
  };
}

function exportSnapshotB64(updatedAt){
  return toB64Unicode(JSON.stringify(snapshotObj(updatedAt)));
}

function enviarParaKodularDebounced(updatedAt){
  if(!isKodular()) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      const b64 = exportSnapshotB64(updatedAt);
      window.AppInventor.setWebViewString(b64);
    }catch(e){
      console.log("Falha ao enviar para Kodular:", e);
    }
  }, 500);
}

/* Função para o Kodular injetar dados */
window.loadFromKodularB64 = function(b64){
  try{
    if(!b64) return;

    const json = fromB64Unicode(b64);
    const data = JSON.parse(json);
    if(!data || typeof data !== "object") return;

    const remoteUpdated = Number(data.updatedAt || 0);
    const localUpdated  = Number(localStorage.getItem("updatedAt") || 0);

    if(localUpdated && remoteUpdated && remoteUpdated <= localUpdated){
      return;
    }

    estoque = Array.isArray(data.estoque) ? data.estoque : [];
    historico = Array.isArray(data.historico) ? data.historico : [];
    lucroTotal = Number(data.lucroTotal || 0);

    try{
      localStorage.setItem("estoque", JSON.stringify(estoque));
      localStorage.setItem("historico", JSON.stringify(historico));
      localStorage.setItem("lucroTotal", String(lucroTotal));
      localStorage.setItem("updatedAt", String(remoteUpdated || Date.now()));
    }catch(e){}

    atualizarDashboard();
    atualizarHistorico();
  }catch(e){
    console.log("loadFromKodularB64 erro:", e);
  }
};

/* ====================== STORAGE ====================== */
function salvarDados(){
  const updatedAt = Date.now();

  try{
    localStorage.setItem("estoque", JSON.stringify(estoque));
    localStorage.setItem("historico", JSON.stringify(historico));
    localStorage.setItem("lucroTotal", String(lucroTotal));
    localStorage.setItem("updatedAt", String(updatedAt));
  }catch(e){
    console.log("localStorage cheio/erro:", e);
  }

  enviarParaKodularDebounced(updatedAt);
}

function carregarDados(){
  try{
    estoque = JSON.parse(localStorage.getItem("estoque")) || [];
    historico = JSON.parse(localStorage.getItem("historico")) || [];
    lucroTotal = parseFloat(localStorage.getItem("lucroTotal")) || 0;
  }catch(e){
    estoque = [];
    historico = [];
    lucroTotal = 0;
  }
  atualizarDashboard();
  atualizarHistorico();
}

/* ====================== NAV ====================== */
function mostrar(id){
  document.querySelectorAll('.card,#venda').forEach(e => e.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id === "venda") renderVenda();
}

/* ====================== GALERIA (somente) ====================== */
const imgInput = document.getElementById("imgInput");
imgInput.addEventListener("change", (e) => carregarImagem(e));

function abrirGaleria(){
  imgInput.click();
}

function removerFoto(){
  imagemTemp = null;
  imgInput.value = "";
  renderPreview(null);
}

function renderPreview(src){
  const box = document.getElementById("previewBox");
  box.innerHTML = "";
  if(!src){
    const hint = document.createElement("div");
    hint.className = "previewHint";
    hint.id = "previewHint";
    hint.innerHTML = "Sem foto<br>(opcional)";
    box.appendChild(hint);
    return;
  }
  const im = document.createElement("img");
  im.src = src;
  box.appendChild(im);
}

/* compressão */
function carregarImagem(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;

  imagemCarregando = true;
  document.getElementById("btnCadastrar").disabled = true;

  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 700;
      let w = img.width, h = img.height;
      const scale = Math.min(1, max / Math.max(w, h));
      const cw = Math.round(w * scale);
      const ch = Math.round(h * scale);

      const canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, cw, ch);

      imagemTemp = canvas.toDataURL("image/jpeg", 0.75);
      renderPreview(imagemTemp);

      imagemCarregando = false;
      document.getElementById("btnCadastrar").disabled = false;
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ====================== CADASTRO ====================== */
function genId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function cadastrar(){
  if(imagemCarregando) return alert("Aguarde a imagem carregar.");
  const nome = document.getElementById("nomeProduto").value.trim();
  const compra = Number(document.getElementById("valorCompra").value);

  if(!nome || !compra) return alert("Preencha tudo");

  estoque.push({
    id: genId(),
    nome,
    compra,
    imagem: imagemTemp
  });

  document.getElementById("nomeProduto").value = "";
  document.getElementById("valorCompra").value = "";
  removerFoto();

  salvarDados();
  atualizarDashboard();
}

/* ====================== VENDA ====================== */
function renderVenda(){
  const vendaDiv = document.getElementById("venda");
  vendaDiv.innerHTML = "";

  if(estoque.length === 0){
    vendaDiv.innerHTML = `<div class="card">Nenhum item em estoque.</div>`;
    return;
  }

  estoque.forEach((p,idx) => {
    vendaDiv.innerHTML += `
      <div class="produto">
        <button class="deleteMini" title="Excluir do estoque" onclick="excluirDoEstoque(${idx})">🗑️</button>
        <img src="${p.imagem || ''}">
        <div>
          <strong>${escapeHtml(p.nome)}</strong><br>
          <small>Custo: R$ ${Number(p.compra).toFixed(2)}</small>

          <input type="date" id="data-${idx}">
          <input type="number" placeholder="Valor de venda" inputmode="decimal" id="venda-${idx}">
          <textarea placeholder="Nota / Detalhes" id="nota-${idx}"></textarea>

          <button class="action" style="background:var(--success)" onclick="vender(${idx})">Vender</button>
        </div>
      </div>`;
  });
}

function excluirDoEstoque(i){
  if(!confirm("Excluir este item do estoque?")) return;
  estoque.splice(i,1);
  salvarDados();
  renderVenda();
  atualizarDashboard();
}

function vender(i){
  const v = parseFloat(document.getElementById(`venda-${i}`).value);
  if(!v) return alert("Informe o valor de venda");

  const p = estoque[i];
  const nota = document.getElementById(`nota-${i}`).value;
  const dataInput = document.getElementById(`data-${i}`).value;
  const dataVenda = dataInput ? new Date(dataInput + "T12:00") : new Date();

  lucroTotal += v - p.compra;

  historico.push({
    ...p,
    venda: v,
    nota,
    data: dataVenda.toLocaleDateString("pt-BR"),
    mes: dataVenda.getMonth(),
    ts: dataVenda.getTime()
  });

  estoque.splice(i,1);

  salvarDados();
  renderVenda();
  atualizarDashboard();
  atualizarHistorico();
}

/* ====================== DASHBOARD ====================== */
function atualizarDashboard(){
  document.getElementById("qtd").textContent = estoque.length;

  const totalEstoque = estoque.reduce((s,p)=>s+Number(p.compra||0),0);
  document.getElementById("valorEstoque").textContent = totalEstoque.toFixed(2);

  const faturamentoTotal = historico.reduce((s,h)=>s+Number(h.venda||0),0);
  document.getElementById("faturamento").textContent = faturamentoTotal.toFixed(2);

  const vendidos = historico.length;
  document.getElementById("itensVendidos").textContent = `Itens vendidos: ${vendidos}`;

  document.getElementById("lucro").textContent = Number(lucroTotal||0).toFixed(2);

  const investimentoVendido = historico.reduce((s,h)=>s+Number(h.compra||0),0);
  const ratio = investimentoVendido > 0 ? (Number(lucroTotal||0) / investimentoVendido) : 0;
  const pct = ratio.toLocaleString("pt-BR", { style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
  document.getElementById("lucroPercent").textContent = `Lucro do investimento: ${pct}`;
}

/* ====================== HISTÓRICO ====================== */
function atualizarHistorico(){
  const mes = document.getElementById("filtroMes").value;
  const list = document.getElementById("historicoLista");
  list.innerHTML = "";

  const arr = historico
    .slice()
    .sort((a,b)=>b.ts-a.ts)
    .filter(h => mes==="" || String(h.mes)===String(mes));

  if(arr.length === 0){
    list.innerHTML = `<div style="opacity:.75">Nenhuma venda registrada.</div>`;
    return;
  }

  arr.forEach((h,i)=>{
    list.innerHTML += `
      <div class="historico-item">
        <div class="historico-header">
          <img src="${h.imagem || ''}">
          <strong onclick="toggleDetalhes(${i})">${escapeHtml(h.nome)}</strong>
          <div onclick="toggleDetalhes(${i})">${h.data}</div>
          <div class="seta" id="seta-${i}" onclick="toggleDetalhes(${i})">▶</div>
        </div>

        <div class="historico-detalhes" id="detalhes-${i}">
          <p>Compra: R$ ${Number(h.compra).toFixed(2)}</p>
          <p>Venda: R$ ${Number(h.venda).toFixed(2)}</p>
          <p>Lucro: R$ ${(Number(h.venda)-Number(h.compra)).toFixed(2)}</p>
          <p>Nota: ${escapeHtml(h.nota || "-")}</p>
          <button class="action" style="background:var(--danger)" onclick="excluirVenda(${i})">Excluir</button>
        </div>
      </div>`;
  });
}

function toggleDetalhes(i){
  const d = document.getElementById(`detalhes-${i}`);
  const s = document.getElementById(`seta-${i}`);
  const aberto = d.style.display === "block";
  d.style.display = aberto ? "none" : "block";
  s.textContent = aberto ? "▶" : "▼";
}

function excluirVenda(i){
  if(!confirm("Excluir esta venda?")) return;
  const mes = document.getElementById("filtroMes").value;

  const arr = historico
    .slice()
    .sort((a,b)=>b.ts-a.ts)
    .filter(h => mes==="" || String(h.mes)===String(mes));

  const item = arr[i];
  if(!item) return;

  const idxReal = historico.findIndex(h => h.ts===item.ts && h.id===item.id);
  if(idxReal === -1) return;

  lucroTotal -= (Number(item.venda) - Number(item.compra));
  historico.splice(idxReal,1);

  salvarDados();
  atualizarDashboard();
  atualizarHistorico();
}

/* ====================== UTIL ====================== */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, (m) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[m]));
}

/* INIT */
renderPreview(null);
carregarDados();
</script>
</body>
</html>
